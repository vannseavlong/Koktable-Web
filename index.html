<!doctype html>
<html lang="<!-- figma:lang -->">
  <head>
    <!-- figma:head-start -->
    <meta charset="UTF-8" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="/images/favicon.svg"
      media="(prefers-color-scheme: light)"
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="/images/favicon_light.svg"
      media="(prefers-color-scheme: dark)"
    />
    <link
      rel="icon"
      type="image/png"
      href="/images/favicon.png"
      media="(prefers-color-scheme: light)"
    />
    <link
      rel="icon"
      type="image/png"
      href="/images/favicon_light.png"
      media="(prefers-color-scheme: dark)"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Baseline CSP — meta tag only, so it can't set frame-ancestors, report-uri, or the
      X-Frame-Options/HSTS headers that need the hosting/CDN layer (see SECURITY_CHECKLIST.md A02).
      connect-src always allows localhost:3000 (lib/constants.ts's DEFAULT_API_BASE_URL, for local
      dev) plus %VITE_API_BASE_URL% — Vite's built-in index.html env substitution, resolved from
      .env.production at build time so a production deploy's real API origin is always in sync
      here without hand-editing this file per deploy. Empty/unset in dev builds — harmless, leaves
      a trailing space before the semicolon.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://images.unsplash.com; connect-src 'self' http://localhost:3000 %VITE_API_BASE_URL%; object-src 'none'; base-uri 'self'; form-action 'self';"
    />
    <title><!-- figma:title --></title>
    <!-- figma:head-end -->
  </head>
  <body>
    <!-- figma:body-start -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- figma:body-end -->
  </body>
</html>
